<section class="gallery-section">
  <h1 class="gallery-kicker">Willow Glen &amp; San Jose Sports Photography</h1>
  <!--
    GALLERY: full-bleed editorial mosaic — tiles are deliberately different sizes so the
    page reads like a curated layout instead of a uniform grid. Each .tile is a placeholder.

    To use a real photo, replace the inner <div class="tile-ph">...</div> with:
    <img src="photos/your-file.jpg" alt="Description of the shot">

    To change a tile's size, swap its size class for one of:
      g-large    (big, spans 4 of 6 columns, 2 rows tall — use for your strongest shots)
      g-wide     (spans 4 columns, 1 row — good for landscape/action shots)
      g-tall     (spans 2 columns, 2 rows — good for portrait-orientation shots)
      g-portrait (spans 2 columns, 3 rows — a fully vertical tile for tall portrait shots)
      g-normal   (spans 2 columns, 1 row — the smallest tile)
    Mix them in any order — grid-auto-flow: dense (in styles.css) fills gaps automatically.
    Edit data-sport / data-cap to control the caption shown on hover and in the lightbox.
  -->
  <div class="gallery">
    <div class="tile g-large" data-sport="Football" data-cap="Willow Glen HS vs Branham — September 10 2026"><img src="photos/Football.01.jpg" alt="A wide receiver lining up for the play"><div class="tile-cap">Football</div></div>
    <div class="tile g-normal" data-sport="Soccer" data-cap="2011 Boys Almaden FC vs Earthquakes Academy — August 23 2025"><img src="photos/Soccer.02.jpg" alt="A player walking off the pitch"><div class="tile-cap">Soccer</div></div>
    <div class="tile g-normal" data-sport="Volleyball" data-cap="Willow Glen HS vs Lincoln — May 5 2026"><img src="photos/Volleyball.01.jpg" alt="A volleyball player getting a deep dig" class="obj-low"><div class="tile-cap">Volleyball</div></div>
    <div class="tile g-portrait" data-sport="Soccer" data-cap="Willow Glen HS vs Westmont — February 12 2026"><img src="photos/Soccer.01.jpg" alt="A player running towards the action" class="obj-left" loading="lazy"><div class="tile-cap">Soccer</div></div>
    <div class="tile g-portrait" data-sport="Football" data-cap="Willow Glen HS vs Branham — September 10 2026"><img src="photos/Football.02.jpg" alt="A referee preparing for the coin toss" loading="lazy"><div class="tile-cap">Football</div></div>
    <div class="tile g-portrait" data-sport="Lacrosse" data-cap="Willow Glen HS vs Ann Sobrato — May 6 2026"><img src="photos/Lacrosse.01.jpg" alt="Two girls at the lacrosse faceoff" loading="lazy"><div class="tile-cap">Lacrosse</div></div>
    <div class="tile g-normal" data-sport="Soccer" data-cap="2011 Boys Sentinels Academy vs Legends FC — May 31 2025"><img src="photos/Soccer.03.jpg" alt="The team in a pre-game huddle" loading="lazy"><div class="tile-cap">Soccer</div></div>
    <div class="tile g-large" data-sport="Softball" data-cap="Willow Glen HS vs Gilroy — May 13 2026"><img src="photos/Softball.01.jpg" alt="Softball pitcher throwing a ball" loading="lazy"><div class="tile-cap">Softball</div></div>
    <div class="tile g-normal" data-sport="Basketball" data-cap="Willow Glen HS vs Pioneer — February 14 2025"><img src="photos/Basketball.01.jpg" alt="A player shooting a 3 point shot" loading="lazy"><div class="tile-cap">Basketball</div></div>
  </div>
